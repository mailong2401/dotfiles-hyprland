# Configuration
font_family                 ComicShannsMono Nerd Font
font_size                   14
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        850
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none
background_opacity 0.6
background_blur 1
allow_remote_control yes
listen_on unix:/tmp/kitty_id_{kitty_pid}
# (đã xoá dòng "kitty --listen-on ..." vì đây không phải cú pháp hợp lệ của
# kitty.conf - nó khiến kitty không bao giờ thực sự mở socket remote-control,
# đây chính là lý do slider/widget không đổi được độ trong suốt của kitty)
cursor_trail 6


shell fish


include colors.conf

